name: Publish Crate

# Versions, tags, changelogs and GitHub releases are owned by
# release-please. This workflow only publishes an already-tagged
# release to crates.io.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, e.g. webkit2gtk-nvidia-quirk-v2.2.0
        required: true
        type: string
      dry_run:
        description: Dry run (verify versions without publishing)
        required: false
        type: boolean
        default: false
      publish:
        description: Publish to crates.io after verification
        required: false
        type: boolean
        default: true

jobs:
  publish_crate:
    if: inputs.publish || inputs.dry_run
    permissions:
      contents: read
      id-token: write # required for crates.io trusted publishing (OIDC)
    runs-on: ubuntu-latest
    name: 📦 Publish to crates.io
    steps:
      - name: 🔄 Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag }}

      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - name: 🔍 Verify tag matches crate version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          CRATE_NAME: webkit2gtk-nvidia-quirk
        run: |
          set -euo pipefail
          EXPECTED_VERSION="${TAG##*-v}"
          ACTUAL_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r --arg name "$CRATE_NAME" '.packages[] | select(.name == $name) | .version')
          if [ "$ACTUAL_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "Error: crate version ($ACTUAL_VERSION) does not match tag $TAG (expected $EXPECTED_VERSION)."
            exit 1
          fi
          echo "Version: $ACTUAL_VERSION"

      - name: 🔐 Authenticate with crates.io (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        if: inputs.publish && !inputs.dry_run

      - name: 📦 Publish to crates.io
        if: inputs.publish && !inputs.dry_run
        shell: bash
        env:
          CRATE_NAME: webkit2gtk-nvidia-quirk
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          cargo publish --package "$CRATE_NAME"

      - name: 📦 Dry-run publish to crates.io
        if: inputs.dry_run
        shell: bash
        env:
          CRATE_NAME: webkit2gtk-nvidia-quirk
        run: |
          set -euo pipefail
          cargo publish --dry-run --package "$CRATE_NAME"
